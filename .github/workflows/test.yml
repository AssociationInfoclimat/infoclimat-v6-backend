name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'nestjs-backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nestjs-backend/**'
      - '.github/workflows/test.yml'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./nestjs-backend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: nestjs-backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma clients
      run: npm run prisma:generate

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm run test

    - name: Run unit tests with coverage
      run: npm run test:cov

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./nestjs-backend/coverage
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./nestjs-backend

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: nestjs-backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Setup test environment
      run: |
        cp .env.sample .env.test
        # Update database URLs for testing
        sed -i 's/localhost:3306/localhost:3306/g' .env.test
        sed -i 's/V5_data_params/test_db/g' .env.test
        sed -i 's/example/password/g' .env.test

    - name: Generate Prisma clients
      run: npm run prisma:generate

    - name: Run integration tests
      run: npm run test:e2e
      env:
        NODE_ENV: test

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./nestjs-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: nestjs-backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma clients
      run: npm run prisma:generate

    - name: Build API
      run: npm run api:build

    - name: Build CRON
      run: npm run cron:build